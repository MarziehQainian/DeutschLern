name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DeutschLern.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build DeutschLern.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DeutschLern.slnx --configuration Release --no-build --no-restore
